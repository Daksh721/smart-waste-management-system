<html>
<head>
    <title>Smart Waste Classifier</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .container { max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
        img { max-width: 100%; margin-top: 20px; border-radius: 5px; display: none; }
        #result { margin-top: 20px; font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Smart Waste Classifier</h2>
    <p>Upload an image to see if it's Recyclable or Organic</p>
    
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="uploadImage()">Classify Waste</button>

    <img id="imagePreview" alt="Image Preview">
    <div id="result"></div>
</div>

<script>
    // Show a preview of the image when selected
    document.getElementById('imageInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgElement = document.getElementById('imagePreview');
                imgElement.src = e.target.result;
                imgElement.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    // Send the image to the Flask back-end
    async function uploadImage() {
        const fileInput = document.getElementById('imageInput');
        const resultDiv = document.getElementById('result');

        if (fileInput.files.length === 0) {
            alert("Please select an image first!");
            return;
        }

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        resultDiv.innerText = "Analyzing...";

        try {
            const response = await fetch('http://localhost:5000/predict', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.error) {
                resultDiv.innerText = "Error: " + data.error;
            } else {
                resultDiv.innerText = `Result: ${data.prediction} (Confidence: ${data.confidence})`;
                // Optional: Change color based on result
                resultDiv.style.color = data.prediction.includes("Recyclable") ? "green" : "brown";
            }
        } catch (error) {
            console.error("Error:", error);
            resultDiv.innerText = "Failed to connect to the server. Is app.py running?";
        }
    }
</script>
</body>
</html>
